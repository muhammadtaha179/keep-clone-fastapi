services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: keep_app
      POSTGRES_PASSWORD: choose_a_strong_password
      POSTGRES_DB: keep_clone
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: